<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="Style.css" type="text/css">
    
</head>
<body>
    <div class="outerline">
        <div class="top">
            <div class="screen">
                <p type="text" id="cal" ></p>
            </div>
        </div>
        <div class="bottom">
           
             <div class="row">
                <div class="button" style="background-color: white;color: black;" onclick="calculate('^')" >^</div>
                <div class="button" style="background-color: white;color: black; "  onclick="calculate('%')">%</div>
                <div class="button" style="background-color: white;color:black" onclick="calculate('AC')">AC</div>
                <div class="button" style="background-color: #f21f1f;color:rgb(251, 248, 248);" onclick="calculate('C')">C</div>
            </div>
             <div class="row">
                <div class="button" style="background-color: rgb(186, 183, 179);" onclick="calculate(7)" >7</div>
                <div class="button" style="background-color: rgb(186, 183, 179);" onclick="calculate(8)">8</div>
                <div class="button" style="background-color: rgb(186, 183, 179);" onclick="calculate(9)">9</div>
                <div class="button" style="background-color: rgb(123, 122, 119);" onclick="calculate('-')">-</div>
            </div>
             <div class="row">
                <div class="button" style="background-color: rgb(186, 183, 179);" onclick="calculate(4)">4</div>
                <div class="button" style="background-color: rgb(186, 183, 179);" onclick="calculate(5)">5</div>
                <div class="button" style="background-color: rgb(186, 183, 179);" onclick="calculate(6)">6</div>
                <div class="button" style="background-color: rgb(123, 122, 119);" onclick="calculate('+')">+</div>
            </div>
             <div class="row">
                <div class="button" style="background-color: rgb(186, 183, 179);" onclick="calculate(1)">1</div>
                <div class="button" style="background-color: rgb(186, 183, 179);" onclick="calculate(2)">2</div>
                <div class="button" style="background-color: rgb(186, 183, 179);" onclick="calculate(3)">3</div>
                <div class="button" style="background-color: rgb(123, 122, 119);" onclick="calculate('*')">x</div>
            </div>
             <div class="row">
                <div class="button" style="background-color: rgb(186, 183, 179);" onclick="calculate('.')">.</div>
                <div class="button" style="background-color: rgb(186, 183, 179);" onclick="calculate(0)">0</div>
                <div class="button" style="background-color: #F77416;" onclick="calculate('=')">=</div>
                <div class="button" style="background-color: rgb(123, 122, 119); " onclick="calculate('/')">/</div>
            </div>
        </div>
    </div>

    <script src="Script.js"></script>
</body>
</html>
